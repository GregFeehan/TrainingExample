<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Policy Labeling Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a labeling-console shell — top tab bar for the four stages, one centered work column (max ~760px), transcript cards set in mono like a real annotation queue. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunk: #eaeef4;
  --ink: #161a22;
  --muted: #5a6373;
  --line: #d9dee7;
  --accent: #2f43c9;
  --accent-ink: #ffffff;
  --accent-soft: #e6e9fb;
  --ok: #1d7f47; --ok-soft: #e2f3e9;
  --bad: #b83434; --bad-soft: #fbe7e7;
  --c-prf: #9a6400; --c-prf-soft: #fbf0d9;
  --c-thr: #b3261e; --c-thr-soft: #fbe3e1;
  --c-har: #7a3db0; --c-har-soft: #f0e6fa;
  --c-hat: #a8295f; --c-hat-soft: #fae4ee;
  --c-spm: #0b7a70; --c-spm-soft: #dcf3f0;
  --c-none: #4b5567; --c-none-soft: #e8ebf0;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1117; --surface: #161a22; --sunk: #1d222c; --ink: #e7eaf0; --muted: #9aa3b4; --line: #2b313d;
  --accent: #8d9bff; --accent-ink: #0e1117; --accent-soft: #232a4a;
  --ok: #5fcf8e; --ok-soft: #173225; --bad: #ff8a80; --bad-soft: #3a1d1d;
  --c-prf: #f2b84b; --c-prf-soft: #34290f; --c-thr: #ff7b72; --c-thr-soft: #3a1b1a;
  --c-har: #c49cf0; --c-har-soft: #2c1f3d; --c-hat: #f37fae; --c-hat-soft: #3a1a29;
  --c-spm: #4fd1c1; --c-spm-soft: #12302d; --c-none: #aab3c3; --c-none-soft: #252b36;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1117; --surface: #161a22; --sunk: #1d222c; --ink: #e7eaf0; --muted: #9aa3b4; --line: #2b313d;
  --accent: #8d9bff; --accent-ink: #0e1117; --accent-soft: #232a4a;
  --ok: #5fcf8e; --ok-soft: #173225; --bad: #ff8a80; --bad-soft: #3a1d1d;
  --c-prf: #f2b84b; --c-prf-soft: #34290f; --c-thr: #ff7b72; --c-thr-soft: #3a1b1a;
  --c-har: #c49cf0; --c-har-soft: #2c1f3d; --c-hat: #f37fae; --c-hat-soft: #3a1a29;
  --c-spm: #4fd1c1; --c-spm-soft: #12302d; --c-none: #aab3c3; --c-none-soft: #252b36;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 960px; margin: 0 auto; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font: 800 17px/1 var(--f-display); letter-spacing: -0.01em; }
.brand span { font: 500 11px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { appearance: none; border: 0; background: none; color: var(--muted); font: 600 14px/1 var(--f-body); padding: 10px 14px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tab .n { font: 500 11px/1 var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab[aria-selected="true"] .n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { max-width: 800px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -0.015em; margin: 0; }
h1 { font-size: clamp(26px, 4.4vw, 36px); line-height: 1.12; font-weight: 800; }
h2 { font-size: 22px; line-height: 1.2; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; letter-spacing: 0; }
p { margin: 0; max-width: 66ch; }
.eyebrow { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.btn { appearance: none; font: 600 14px/1 var(--f-body); border-radius: 7px; padding: 11px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--f-body); padding: 5px 8px; border-radius: 5px; background: var(--k-soft); color: var(--k); white-space: nowrap; }
.chip code { font: 500 11px/1 var(--f-mono); letter-spacing: .04em; }
.k-PRF { --k: var(--c-prf); --k-soft: var(--c-prf-soft); }
.k-THR { --k: var(--c-thr); --k-soft: var(--c-thr-soft); }
.k-HAR { --k: var(--c-har); --k-soft: var(--c-har-soft); }
.k-HAT { --k: var(--c-hat); --k-soft: var(--c-hat-soft); }
.k-SPM { --k: var(--c-spm); --k-soft: var(--c-spm-soft); }
.k-NONE { --k: var(--c-none); --k-soft: var(--c-none-soft); }

/* Transcript card */
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.item-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 9px 14px; background: var(--sunk); border-bottom: 1px solid var(--line); font: 500 11.5px/1.3 var(--f-mono); color: var(--muted); }
.item-body { padding: 16px 14px; font: 400 15.5px/1.6 var(--f-mono); overflow-wrap: anywhere; }
.item-note { padding: 12px 14px; border-top: 1px dashed var(--line); font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.item-note .chip { flex: none; }
.item-note p { min-width: 0; }

/* Slides */
.slide-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.progress { display: flex; gap: 4px; }
.progress i { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.progress i.on { background: var(--accent); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.cat-card { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--k); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cat-card h3 { color: var(--k); }
.callout { background: var(--accent-soft); border-radius: 8px; padding: 16px 18px; }
.gloss { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.gloss ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.gloss .box { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--surface); min-width: 0; }
.gloss .box.look h3 { color: var(--k); }
.gloss .box.not { background: var(--sunk); }
mark { background: var(--k-soft); color: var(--k); padding: 0 3px; border-radius: 3px; font-weight: 500; }
.k-NONE mark, mark.neutral { background: var(--sunk); color: var(--ink); }
.cat-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.cat-title h2 { color: var(--k); }
.rank { width: 100%; border-collapse: collapse; font-size: 14px; }
.rank td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rank td:first-child { font: 500 12px var(--f-mono); color: var(--muted); width: 36px; }

/* Labeling */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.opt { appearance: none; text-align: left; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px/1.25 var(--f-body); cursor: pointer; min-width: 0; }
.opt .key { font: 500 11px/1 var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; flex: none; }
.opt .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--k); flex: none; }
.opt:hover:not(:disabled) { border-color: var(--k); }
.opt.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.opt:disabled { cursor: default; }
.fb { border-radius: 8px; padding: 14px 16px; font-size: 14.5px; display: flex; flex-direction: column; gap: 6px; }
.fb.tip { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.fb.tip b { color: var(--bad); }
.fb.good { background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.fb.good b { color: var(--ok); }
.fb.anim { animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(4px); opacity: .4 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .fb.anim { animation: none; } }

.score { font: 800 56px/1 var(--f-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 150px 1fr 48px; gap: 10px; align-items: center; font-size: 14px; }
.bar .track { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar .fill { height: 100%; background: var(--k); }
.bar .v { font: 500 12px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .bar { grid-template-columns: 1fr 44px; } .bar .track { grid-column: 1 / -1; grid-row: 2; } }
.badge { font: 600 12px/1 var(--f-body); padding: 6px 10px; border-radius: 999px; }
.badge.pass { background: var(--ok-soft); color: var(--ok); }
.badge.fail { background: var(--bad-soft); color: var(--bad); }

.doc h2 { margin-top: 8px; }
.doc ol, .doc ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 66ch; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.tbl { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--sunk); }
.tbl tr:last-child td { border-bottom: 0; }
.quiz { border-color: var(--accent); }
.qopts { display: flex; flex-direction: column; gap: 8px; }
.qopt { appearance: none; text-align: left; display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 400 14.5px/1.5 var(--f-mono); cursor: pointer; }
.qopt .key { font: 500 11px/1 var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; flex: none; margin-top: 2px; }
.qopt .qt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.qopt .chip { flex: none; }
.qopt:hover:not(:disabled) { border-color: var(--accent); }
.qopt:disabled { cursor: default; }
.qopt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.qopt.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 0 0 1px var(--ok); }
.kbd-hint { font: 400 12px var(--f-mono); color: var(--muted); }
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand"><b>Policy Labeling Academy</b><span>Project MOD-5 · Annotator onboarding</span></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main id="app"></main>

<script>
/* ============ DATA ============ */
const CATS = {
  PRF: { name: "Profanity", full: "Profanity & Vulgar Language", short: "Swear words or vulgar terms, including disguised spellings, that are not aimed at a person." },
  THR: { name: "Threat", full: "Threats & Violent Intent", short: "Any statement of intent, wish, or call for others to cause physical harm to a real person, group, or their property." },
  HAR: { name: "Harassment", full: "Harassment & Bullying", short: "Insults, mockery, or intimidation aimed at a specific person, for reasons unrelated to who they are as part of a group." },
  HAT: { name: "Hate Speech", full: "Hate Speech", short: "Attacks, stereotypes, or dehumanizing language about people based on a protected characteristic." },
  SPM: { name: "Spam / Scam", full: "Spam & Scams", short: "Unsolicited promotion, get-rich-quick offers, or attempts to collect logins, money, or personal data." },
  NONE:{ name: "No violation", full: "No violation", short: "Strong, rude, or emotional language that does not meet any category definition." }
};
const ORDER = ["PRF","THR","HAR","HAT","SPM","NONE"];

const TRAIN = {
  PRF: {
    def: "Explicit swear words, crude sexual or bodily terms, and disguised versions of them. Profanity is labeled even when the tone is positive. If the profanity is aimed at a person to insult them, it becomes Harassment instead.",
    look: ["Common swear words in any form (f***, sh*t, b*llsh*t, a**)", "Disguised spellings: symbols or numbers (sh1t, $hit, a$$), extra spaces (s h i t), or missing letters (fck)", "Profanity acronyms: WTF, FFS, BS", "Crude sexual or bodily terms used as filler or emphasis", "Profanity aimed at a thing, situation, or oneself"],
    not: ["Mild substitutes: darn, heck, frick, shoot, crud", "Words that only contain a swear string inside another word (e.g. a place name)", "Profanity directed at a person → label Harassment", "Profanity alongside a threat or hate → label the more severe category"],
    ex: [
      { src: "Message board · #app-feedback", text: "This update is a load of sh*t, nothing works anymore.", hl: "sh*t", why: "The swear word is aimed at the product, not at a person. Nothing else in the message is a violation, so the label is Profanity." },
      { src: "Audio transcript · 00:42", text: "Just finished the marathon, f***ing exhausted but so happy!!", hl: "f***ing", why: "Profanity counts even when the speaker is happy. The tone does not matter; the word does." }
    ]
  },
  THR: {
    def: "Any statement of intent, desire, or encouragement to physically harm a real person or group, or to damage their property. This includes conditional threats (\"if you…\"), veiled threats that rely on implication, and calls for other people to carry out harm.",
    look: ["First person intent: \"I'm going to / I will [hurt, break, beat, shoot] you\"", "Conditional framing: \"If you show up…\", \"Keep talking and…\"", "Location or routine details: \"I know where you live / park / work\"", "Veiled phrasing: \"Would be a shame if something happened…\"", "Calls for others: \"Someone should…\", sharing an address alongside anger", "Wishing serious harm on someone, especially with personal involvement"],
    not: ["Common idioms: \"killing it\", \"I could murder a pizza\", \"this traffic is killing me\"", "Competitive trash talk about games or sports (\"we'll destroy you tonight\")", "Fiction, song lyrics, or news reporting that describes violence", "Rude dismissal without harm (\"get lost\") → consider Harassment"],
    ex: [
      { src: "Message board · #local-meetups", text: "If you show up at the meetup Saturday, I'm going to break your jaw.", hl: "I'm going to break your jaw", why: "A specific person, a specific time, and a specific physical harm. The \"if\" does not soften it; conditional threats are still threats." },
      { src: "Audio transcript · 02:15", text: "Nice car you parked on Elm Street. Would be a shame if something happened to it.", hl: "Would be a shame if something happened to it", why: "No violent word appears, but the speaker shows they know where the person's property is and implies damage. Veiled threats count." }
    ]
  },
  HAR: {
    def: "Content that targets a specific, identifiable person with insults, mockery, humiliation, intimidation, or exclusion. The attack is personal. If the attack is based on a protected characteristic (race, religion, gender and so on), label Hate Speech instead.",
    look: ["@mentions, usernames, or \"you\" paired with an insult", "Name-calling: idiot, loser, clown, braindead", "Mocking someone's looks, intelligence, or personal life", "Telling someone to leave, shut up, or delete their account", "Profanity aimed at a person (\"shut the f*** up\")", "Encouraging a pile-on or posting someone's personal details to embarrass them"],
    not: ["Criticizing an idea, argument, or piece of work (\"this take makes no sense\")", "Plain disagreement, even blunt disagreement", "Insults tied to a protected group → Hate Speech", "Insults with intent to cause physical harm → Threat"],
    ex: [
      { src: "Message board · #running-club", text: "@jess_runs nobody here likes you. Delete your account and do us all a favor.", hl: "nobody here likes you", why: "A named user is singled out and told to leave. There is no swear word, but the message is a personal attack meant to exclude." },
      { src: "Audio transcript · 05:03", text: "Shut the f*** up, you absolute clown. Nobody asked.", hl: "Shut the f*** up, you absolute clown", why: "This has profanity, but it is aimed at the listener to demean them. When profanity is directed at a person, Harassment takes priority over Profanity." }
    ]
  },
  HAT: {
    def: "Content that attacks, demeans, stereotypes, or calls for the exclusion of people based on a protected characteristic. Protected characteristics: race, ethnicity, national origin, religion, gender, sexual orientation, gender identity, disability, and age. It applies whether the target is a whole group or one person attacked because of their group.",
    look: ["Generalizations: \"all / those / you people [group] are…\"", "Dehumanizing comparisons: animals, vermin, disease, parasites", "Claims that a group is inferior, dangerous, or criminal", "Calls to exclude a group from a country, job, or right", "Slurs, including disguised or coded spellings", "An insult to one person that leans on their group (\"typical [group]…\")"],
    not: ["Criticizing a policy, institution, or belief system (\"I disagree with this church's stance\")", "Reporting on or condemning hate speech", "Neutral mention of a group (\"as a woman in tech, I…\")", "Hateful content that also threatens violence → Threat"],
    ex: [
      { src: "Message board · #world-news", text: "People from that religion are all terrorists and shouldn't be allowed in this country.", hl: "all terrorists", why: "A whole religious group is labeled as criminals and the writer calls for their exclusion. Religion is a protected characteristic." },
      { src: "Audio transcript · 11:48", text: "Women are too emotional to be engineers. They should stay out of tech.", hl: "Women are too emotional", why: "A negative stereotype about gender, followed by a call to exclude. No slur is needed for this to be Hate Speech." }
    ]
  },
  SPM: {
    def: "Unsolicited commercial promotion, deceptive money-making offers, and phishing or scam attempts that try to get users to click, pay, or hand over passwords, codes, or personal data.",
    look: ["Links, especially shortened or disguised ones (bit.ly, \"dot com\", \"link in bio\")", "\"DM me\", \"click here\", \"reply to claim\"", "Unrealistic earnings or prizes: \"$5,000/week\", \"you've won\"", "Urgency: \"within 24 hours\", \"limited offer\", \"account will be deleted\"", "Requests for passwords, recovery phrases, card numbers, or codes", "Selling followers, likes, or reviews; crypto bots"],
    not: ["Sharing a relevant link because someone asked, or as part of the discussion", "Recommending a product you use when it fits the conversation", "Official announcements from the platform itself"],
    ex: [
      { src: "Message board · #general", text: "🔥 Make $5,000/week from home!! DM me or click bit.ly/xx-cash 🔥", hl: "bit.ly/xx-cash", why: "Off-topic, unrealistic earnings, a shortened link, and a \"DM me\" call to action. Classic promotional spam." },
      { src: "Message board · Direct message", text: "Your account has been flagged. Verify your login here within 24h or it will be deleted: secure-login-verify.co", hl: "Verify your login here within 24h", why: "Urgency plus a request for credentials on a look-alike domain. This is phishing, which falls under Spam & Scams." }
    ]
  }
};

/* Training check: "Which demonstrates [label]?" — one correct phrase, three near-misses. k = the label the phrase actually gets. */
const QUIZ = {
  PRF: [
    { t:"Ugh, my sh*tty laptop died right before the deadline.", k:"PRF", why:"A swear word aimed at a thing, with no person targeted. This is Profanity." },
    { t:"Frick, I left my keys in the car again.", k:"NONE", why:"\"Frick\" is a mild substitute, not profanity. No violation." },
    { t:"You're a worthless sack of sh*t, @dan_p.", k:"HAR", why:"The profanity is aimed at a named user, so it's Harassment, which outranks Profanity." },
    { t:"I'll f***ing end you if you post that again.", k:"THR", why:"There's profanity, but this is a conditional threat. Threat outranks everything." }
  ],
  THR: [
    { t:"This boss fight is going to kill me, I've died 40 times.", k:"NONE", why:"\"Going to kill me\" is an idiom about a hard video game. No one is in danger." },
    { t:"I see you jog past the park every morning at 6. Enjoy it while you can.", k:"THR", why:"Knowing someone's routine plus \"enjoy it while you can\" implies harm. That's a veiled Threat." },
    { t:"You're a coward and everyone in this group knows it.", k:"HAR", why:"A personal insult with no harm implied. That's Harassment." },

    <p>Users sometimes express themselves in strong terms. Emotions run high in discussions about sports, politics, products and each other, and most heated language is still allowed. We want our system to identify any and all real violations and tag them correctly, while avoiding false positives on content that's merely blunt, emotional or figurative.</p>

    <div class="panel"><table class="rank"><tbody>
      <tr><td>1</td><td>${chip("THR")}</td></tr><tr><td>2</td><td>${chip("HAT")}</td></tr><tr><td>3</td><td>${chip("HAR")}</td></tr><tr><td>4</td><td>${chip("SPM")}</td></tr><tr><td>5</td><td>${chip("PRF")}</td></tr>
    </tbody></table></div>

function quiz(s) {
  const tried = S.quiz[s] || [], qs = QUIZ[s], solved = tried.some(i => qs[i].k === s);

  else if (last !== undefined) fb = `<div class="fb tip anim"><b>Not quite. This one is ${CATS[qs[last].k].name}.</b><span>${qs[last].why} Try another.</span></div>`;
  return `<div class="panel stack quiz">
    <span class="eyebrow">Check yourself</span>
    <h2>Which of these demonstrates ${CATS[s].full}?</h2>
    <div class="qopts">${qs.map((q,i) => {
      const done = tried.includes(i) || solved;
      const cls = tried.includes(i) ? (q.k === s ? "right" : "wrong") : "";
      return `<button class="qopt ${cls}" data-q="${s}" data-i="${i}" ${done?"disabled":""}><span class="key">${"ABCD"[i]}</span><span class="qt">${esc(q.t)}</span>${tried.includes(i) || solved ? `<span class="chip k-${q.k}"><code>${q.k}</code></span>` : ""}</button>`;
    }).join("")}</div>
    ${fb}
  </div>`;
}

function sandbox() {
  const sb = S.sb;

      <div class="panel stack"><div class="score">${n}<span class="muted" style="font-size:24px">/12</span></div><p class="muted">Correct on the first try. The test needs ${PASS} of 12 and gives no hints.</p></div>

    <div class="stack"><div class="spread"><h3>Which label applies?</h3><span class="kbd-hint">Keys 1–6</span></div>

function genericTip(chosen, q) {
  const notes = {
    PRF: "Profanity only applies when a swear word is present and isn't aimed at a person.",
    THR: "A Threat needs intent, a wish, or a call to cause physical harm, stated or clearly implied.",
    HAR: "Harassment needs a specific person as the target of an insult or intimidation.",
    HAT: "Hate Speech needs an attack tied to a protected characteristic such as race, religion, gender or age.",
    SPM: "Spam needs promotion, a scam, or an attempt to collect money or personal data.",
    NONE: "Something in this item does meet a category definition. Look for who or what the language targets."
  };
  return notes[chosen];
}
function sbPick(k) {
  const sb = S.sb, q = SANDBOX[sb.i];
  if (sb.tried.includes(q.a) || sb.tried.includes(k)) return;
  if (sb.tried.length === 0) sb.first[q.id] = (k === q.a);
  sb.tried.push(k); render();
}

/* ============ TEST ============ */
function test() {
  const t = S.t;
  if (!t.started) return `<div class="stack-lg">
    <div class="stack"><span class="eyebrow">Certification</span><h1>Labeling test</h1></div>
    <p>12 new items. Choose one label for each and submit. You won't see whether an answer was right until the end, and you can't go back.</p>
    <div class="panel stack"><div class="spread"><span>Items</span><b>12</b></div><div class="spread"><span>Passing score</span><b>${PASS} / 12</b></div><div class="spread"><span>Feedback</span><b>Score and category breakdown at the end</b></div></div>
    <div class="row"><button class="btn primary" id="tstart">Start the test</button></div></div>`;
  if (t.done) {
    const n = TEST.filter(q => t.ans[q.id] === q.a).length, pass = n >= PASS;
    const rows = ORDER.map(k => { const qs = TEST.filter(q=>q.a===k), c = qs.filter(q=>t.ans[q.id]===k).length; return `<div class="bar k-${k}"><span>${CATS[k].name}</span><div class="track"><div class="fill" style="width:${qs.length?c/qs.length*100:0}%"></div></div><span class="v">${c}/${qs.length}</span></div>`; }).join("");
    return `<div class="stack-lg"><div class="stack"><span class="eyebrow">Test complete</span><h1>${pass?"You passed":"Not quite yet"}</h1></div>
      <div class="panel stack"><div class="row"><div class="score">${n}<span class="muted" style="font-size:24px">/12</span></div><span class="badge ${pass?"pass":"fail"}">${pass?"PASS":"BELOW " + PASS + "/12"}</span></div>
      <p class="muted">${pass ? "You're cleared to start on live MOD-5 tasks." : "Review the categories where you dropped points, then try the Sandbox again before retaking."}</p></div>
      <div class="panel stack"><h3>Accuracy by correct label</h3><div class="bars">${rows}</div></div>
      <div class="row"><button class="btn" onclick="go('train')">Review training</button><button class="btn primary" id="tretake">Retake test</button></div></div>`;
  }
  const q = TEST[t.i];
  return `<div class="stack-lg">
    <div class="slide-meta"><span class="eyebrow">Test · Item ${t.i+1} of ${TEST.length}</span><div class="progress">${TEST.map((_,i)=>`<i class="${i<=t.i?"on":""}"></i>`).join("")}</div></div>
    <div class="item"><div class="item-head"><span>${esc(q.src)}</span><span>${q.id}</span></div><div class="item-body">${esc(q.text)}</div></div>
    <div class="stack"><div class="spread"><h3>Which label applies?</h3><span class="kbd-hint">Keys 1–6 · Enter to submit</span></div>
    ${options(() => "", k => t.sel===k ? "sel" : "")}</div>
    <div class="spread"><span></span><button class="btn primary" id="tsubmit" ${t.sel?"":"disabled"}>${t.i===TEST.length-1?"Submit and finish":"Submit answer →"}</button></div>
  </div>`;
}
function tSubmit() { const t = S.t; if (!t.sel) return; t.ans[TEST[t.i].id] = t.sel; t.sel = null; if (t.i === TEST.length-1) t.done = true; else t.i++; render(); }

/* ============ RENDER + EVENTS ============ */
function render() {
  renderTabs();
  const app = document.getElementById("app");
  app.innerHTML = { guide, train, sandbox, test }[S.tab]();
}
document.getElementById("app").addEventListener("click", e => {
  const id = e.target.closest("button")?.id, opt = e.target.closest(".opt"), qo = e.target.closest(".qopt");
  if (qo && !qo.disabled) { const s = qo.dataset.q; (S.quiz[s] = S.quiz[s] || []).push(+qo.dataset.i); render(); return; }
  if (id === "prev" && S.slide > 0) { S.slide--; render(); scrollTo({top:0}); }
  else if (id === "next") { S.slide++; render(); scrollTo({top:0}); }
  else if (opt && S.tab === "sandbox") sbPick(opt.dataset.k);
  else if (opt && S.tab === "test") { S.t.sel = opt.dataset.k; render(); }
  else if (id === "sbnext") { const sb = S.sb; if (sb.i === SANDBOX.length-1) sb.done = true; else { sb.i++; sb.tried = []; } render(); scrollTo({top:0}); }
  else if (id === "sbreset") { S.sb = { i:0, tried:[], done:false, first:{} }; render(); }
  else if (id === "tstart") { S.t.started = true; render(); }
  else if (id === "tsubmit") tSubmit();
  else if (id === "tretake") { S.t = { started:true, i:0, sel:null, ans:{}, done:false }; render(); }
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 6) {
    const k = ORDER[n-1];
    if (S.tab === "sandbox" && !S.sb.done) sbPick(k);
    if (S.tab === "test" && S.t.started && !S.t.done) { S.t.sel = k; render(); }
  } else if (e.key === "Enter" && S.tab === "test" && S.t.started && !S.t.done && S.t.sel) { e.preventDefault(); tSubmit(); }
});
render();
</script>

</body></html>
