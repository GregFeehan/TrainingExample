/* ============ GUIDELINES ============ */
function guide() {

/* ============ TRAINING ============ */
const SLIDES = ["overview","glance","EXT","HAT","SEM","VDB","SSH","rank"];
function hl(text, phrase) { const t = esc(text), p = esc(phrase); return t.replace(p, `<mark>${p}</mark>`); }
function exCard(e, k) {
  return `<div class="item k-${k}"><div class="item-head"><span>${esc(e.src)}</span><span>Policy Example</span></div>
  <div class="item-body">${hl(e.text, e.hl)}</div>
  <div class="item-note">${chip(k)}<p>${e.why}</p></div></div>`;
}
function slideBody(s) {

    <div class="stack"><span class="eyebrow">Module 1 · Overview</span><h1>Spotify Voice: Responsible & Clear</h1></div>

    <div class="cat-grid">${["EXT","HAT","SEM","VDB","SSH"].map(k => `<div class="cat-card k-${k}"><div class="row">${chip(k)}</div><h3>${CATS[k].full}</h3><p class="muted" style="font-size:13.5px">${CATS[k].short}</p></div>`).join("")}

    <div class="stack"><span class="eyebrow">Module 8 · Synthesis</span><h1>Resolving Overlapping Violations</h1></div>

    <div class="panel"><table class="rank"><tbody>
      <tr><td>1</td><td>${chip("EXT")}</td><td>Terrorist recruitment, VEO promotion, and violent extremism.</td></tr>
      <tr><td>2</td><td>${chip("HAT")}</td><td>Protected characteristic attacks, hate figures, and dehumanization.</td></tr>
      <tr><td>3</td><td>${chip("SEM")}</td><td>Graphic descriptions, non-consensual acts, and prostitution.</td></tr>
      <tr><td>4</td><td>${chip("VDB")}</td><td>Physical injury, mass casualties, viral challenges, and drug abuse.</td></tr>
      <tr><td>5</td><td>${chip("SSH")}</td><td>Suicide instruction, self-harm accompaniment, and mocking.</td></tr>
    </tbody></table></div>
    <div class="callout stack"><h3>Ready for Practice</h3><p>Proceed to the Sandbox to review 12 interactive scenarios with instant guidance on incorrect picks.</p>
    <div class="row"><button class="btn primary" onclick="go('sandbox')">Open Sandbox</button></div></div>
  </div>`;
  
  const t = TRAIN[s], c = CATS[s];
  const idx = ["EXT","HAT","SEM","VDB","SSH"].indexOf(s) + 1;
  return `<div class="stack-lg k-${s}">
    <div class="stack"><span class="eyebrow">Category ${idx} of 5</span>
      <div class="cat-title"><h1>${c.full}</h1><span class="chip k-${s}"><code>${s}</code></span></div>
      <p>${t.def}</p></div>
    <div class="stack"><h2>Annotated Examples</h2>${t.ex.map(e => exCard(e, s)).join("")}</div>
    <div class="stack"><h2>Boundary Signals</h2>
      <div class="gloss">
        <div class="box look k-${s}"><h3>Violative Signals (${c.name})</h3><ul>${t.look.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="box not"><h3>Out of Scope / Permitted</h3><ul>${t.not.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>

function quiz(s) {
  const tried = S.quiz[s] || [], qs = QUIZ[s], solved = tried.some(i => qs[i].k === s);
  const last = tried[tried.length-1];
  let fb = "";
  if (solved) { const c = qs.find(q => q.k === s); fb = `<div class="fb good anim"><b>Correct Policy Label</b><span>${c.why}</span></div>`; }
  else if (last !== undefined) fb = `<div class="fb tip anim"><b>Incorrect (${CATS[qs[last].k].name})</b><span>${qs[last].why} Try another option.</span></div>`;
  return `<div class="panel stack quiz">
    <span class="eyebrow">Knowledge Check</span>
    <h2>Which scenario violates ${CATS[s].full}?</h2>
    <div class="qopts">${qs.map((q,i) => {
      const done = tried.includes(i) || solved;
      const cls = tried.includes(i) ? (q.k === s ? "right" : "wrong") : "";
      return `<button class="qopt ${cls}" data-q="${s}" data-i="${i}" ${done?"disabled":""}><span class="key">${"ABCD"[i]}</span><span class="qt">${esc(q.t)}</span>${tried.includes(i) || solved ? `<span class="chip k-${q.k}"><code>${q.k}</code></span>` : ""}</button>`;
    }).join("")}</div>
    ${fb}
  </div>`;
}
function train() {
  const s = SLIDES[S.slide];
  return `<div class="stack-lg">
    <div class="slide-meta"><span class="eyebrow">Training Slide ${S.slide+1} of ${SLIDES.length}</span><div class="progress">${SLIDES.map((_,i)=>`<i class="${i<=S.slide?"on":""}"></i>`).join("")}</div></div>
    ${slideBody(s)}
    <div class="spread"><button class="btn" id="prev" ${S.slide===0?"disabled":""}>← Back</button>
    ${S.slide < SLIDES.length-1 ? `<button class="btn primary" id="next">Next Slide →</button>` : ""}</div>
  </div>`;
}

/* ============ SANDBOX ============ */
function options(state, cls) {
  return `<div class="opts">${ORDER.map((k,i) => `<button class="opt k-${k} ${cls(k)}" data-k="${k}" ${state(k)}><span class="key">${i+1}</span><span class="dot"></span>${CATS[k].name}</button>`).join("")}</div>`;
}
function sandbox() {
  const sb = S.sb;
  if (sb.done) {
    const n = SANDBOX.filter(q => sb.first[q.id]).length;
    return `<div class="stack-lg"><div class="stack"><span class="eyebrow">Sandbox Complete</span><h1>Practice Results</h1></div>
      <div class="panel stack"><div class="score">${n}<span class="muted" style="font-size:24px">/12</span></div><p class="muted">First-try accuracy across practice items. Passing certification requires ${PASS}/12 on the test.</p></div>
      <div class="panel stack"><h3>Items requiring review</h3>${SANDBOX.filter(q=>!sb.first[q.id]).map(q=>`<div class="row"><span class="kbd-hint">${q.id}</span>${chip(q.a)}<span style="min-width:0">${esc(q.text)}</span></div>`).join("") || "<p>Flawless practice run! You are ready for the certification test.</p>"}</div>
      <div class="row"><button class="btn" id="sbreset">Retry Sandbox</button><button class="btn primary" onclick="go('test')">Start Certification Test</button></div></div>`;
  }
  const q = SANDBOX[sb.i], solved = sb.tried.includes(q.a), last = sb.tried[sb.tried.length-1];
  let fb = "";
  if (solved) fb = `<div class="fb good anim"><b>Correct: ${CATS[q.a].full}</b><span>${q.why}</span></div>`;
  else if (last) fb = `<div class="fb tip anim"><b>Not ${CATS[last].name}</b><span>${q.tips[last] || genericTip(last)}</span></div>`;
  return `<div class="stack-lg">
    <div class="slide-meta"><span class="eyebrow">Sandbox Practice · Item ${sb.i+1} of ${SANDBOX.length}</span><div class="progress">${SANDBOX.map((_,i)=>`<i class="${i<=sb.i?"on":""}"></i>`).join("")}</div></div>
    <div class="item"><div class="item-head"><span>${esc(q.src)}</span><span>${q.id}</span></div><div class="item-body">${esc(q.text)}</div></div>
    <div class="stack"><div class="spread"><h3>Select Policy Label</h3><span class="kbd-hint">Keys 1–6</span></div>
    ${options(k => solved || sb.tried.includes(k) ? "disabled" : "", k => k===q.a && solved ? "right" : sb.tried.includes(k) ? "wrong" : "")}</div>
    ${fb}
    <div class="spread"><span class="muted" style="font-size:13px">${Object.values(sb.first).filter(Boolean).length} correct on first attempt</span>
    <button class="btn primary" id="sbnext" ${solved?"":"disabled"}>${sb.i===SANDBOX.length-1?"View Summary":"Next Item →"}</button></div>
  </div>`;
}
function genericTip(chosen) {
  const notes = {
    EXT: "Violent Extremism requires VEO glorification, terror attacks, or adopting extremist jargon ('red pill').",
    HAT: "Hate requires attacking or dehumanizing groups based on protected characteristics or lionizing hate figures.",
    SEM: "SEM requires graphic sexual language, non-consensual acts, prostitution, or explicit intent signals.",
    VDB: "Violent Behaviour requires actionable physical harm, mass casualty vibes, lethal challenges, or intoxication endangerment.",
    SSH: "Suicide & Self-Harm requires instruction, soundtracks, concealment, or dismissive mocking tone.",
    NONE: "This output does violate a specific policy boundary. Re-examine the framing and context."
  };
  return notes[chosen];
}
function sbPick(k) {
  const sb = S.sb, q = SANDBOX[sb.i];
  if (sb.tried.includes(q.a) || sb.tried.includes(k)) return;
  if (sb.tried.length === 0) sb.first[q.id] = (k === q.a);
  sb.tried.push(k); render();
}

/* ============ TEST ============ */
function test() {
  const t = S.t;
  if (!t.started) return `<div class="stack-lg">
    <div class="stack"><span class="eyebrow">Certification</span><h1>Labeling Competency Test</h1></div>
    <p>Complete 12 test items under real annotation conditions. Responses receive no immediate feedback; accuracy and category performance will be calculated at completion.</p>
    <div class="panel stack"><div class="spread"><span>Total Items</span><b>12</b></div><div class="spread"><span>Passing Threshold</span><b>${PASS} / 12 (83%)</b></div><div class="spread"><span>Review Mode</span><b>Full breakdown provided after submission</b></div></div>
    <div class="row"><button class="btn primary" id="tstart">Begin Certification Exam</button></div></div>`;
  if (t.done) {
    const n = TEST.filter(q => t.ans[q.id] === q.a).length, pass = n >= PASS;
    const rows = ORDER.map(k => {
      const qs = TEST.filter(q=>q.a===k);
      if (!qs.length) return "";
      const c = qs.filter(q=>t.ans[q.id]===k).length;
      return `<div class="bar k-${k}"><span>${CATS[k].name}</span><div class="track"><div class="fill" style="width:${qs.length?c/qs.length*100:0}%"></div></div><span class="v">${c}/${qs.length}</span></div>`;
    }).join("");
    return `<div class="stack-lg"><div class="stack"><span class="eyebrow">Evaluation Finished</span><h1>${pass?"Certification Passed":"Certification Below Target"}</h1></div>
      <div class="panel stack"><div class="row"><div class="score">${n}<span class="muted" style="font-size:24px">/12</span></div><span class="badge ${pass?"pass":"fail"}">${pass?"PASSED":"FAILED (" + PASS + "/12 REQUIRED)"}</span></div>
      <p class="muted">${pass ? "You have satisfied all onboarding requirements for Spotify AI Voice moderation tasks." : "Review categories with low accuracy in the training module before retaking the assessment."}</p></div>
      <div class="panel stack"><h3>Category Accuracy Breakdown</h3><div class="bars">${rows}</div></div>
      <div class="row"><button class="btn" onclick="go('train')">Review Policies</button><button class="btn primary" id="tretake">Retake Test</button></div></div>`;
  }
  const q = TEST[t.i];
  return `<div class="stack-lg">
    <div class="slide-meta"><span class="eyebrow">Test Evaluation · Item ${t.i+1} of ${TEST.length}</span><div class="progress">${TEST.map((_,i)=>`<i class="${i<=t.i?"on":""}"></i>`).join("")}</div></div>
    <div class="item"><div class="item-head"><span>${esc(q.src)}</span><span>${q.id}</span></div><div class="item-body">${esc(q.text)}</div></div>
    <div class="stack"><div class="spread"><h3>Assign Policy Label</h3><span class="kbd-hint">Keys 1–6 · Enter to confirm</span></div>
    ${options(() => "", k => t.sel===k ? "sel" : "")}</div>
    <div class="spread"><span></span><button class="btn primary" id="tsubmit" ${t.sel?"":"disabled"}>${t.i===TEST.length-1?"Submit Exam":"Confirm & Next →"}</button></div>
  </div>`;
}
function tSubmit() { const t = S.t; if (!t.sel) return; t.ans[TEST[t.i].id] = t.sel; t.sel = null; if (t.i === TEST.length-1) t.done = true; else t.i++; render(); }

/* ============ RENDER + CONTROLLERS ============ */
function render() {
  renderTabs();
  const app = document.getElementById("app");
  app.innerHTML = { guide, train, sandbox, test }[S.tab]();
}
document.getElementById("app").addEventListener("click", e => {
  const id = e.target.closest("button")?.id, opt = e.target.closest(".opt"), qo = e.target.closest(".qopt");
  if (qo && !qo.disabled) { const s = qo.dataset.q; (S.quiz[s] = S.quiz[s] || []).push(+qo.dataset.i); render(); return; }
  if (id === "prev" && S.slide > 0) { S.slide--; render(); scrollTo({top:0}); }
  else if (id === "next") { S.slide++; render(); scrollTo({top:0}); }
  else if (opt && S.tab === "sandbox") sbPick(opt.dataset.k);
  else if (opt && S.tab === "test") { S.t.sel = opt.dataset.k; render(); }
  else if (id === "sbnext") { const sb = S.sb; if (sb.i === SANDBOX.length-1) sb.done = true; else { sb.i++; sb.tried = []; } render(); scrollTo({top:0}); }
  else if (id === "sbreset") { S.sb = { i:0, tried:[], done:false, first:{} }; render(); }
  else if (id === "tstart") { S.t.started = true; render(); }
  else if (id === "tsubmit") tSubmit();
  else if (id === "tretake") { S.t = { started:true, i:0, sel:null, ans:{}, done:false }; render(); }
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 6) {
    const k = ORDER[n-1];
    if (S.tab === "sandbox" && !S.sb.done) sbPick(k);
    if (S.tab === "test" && S.t.started && !S.t.done) { S.t.sel = k; render(); }
  } else if (e.key === "Enter" && S.tab === "test" && S.t.started && !S.t.done && S.t.sel) {
    e.preventDefault(); tSubmit();
  }
});
render();
</script>
</body></html>
